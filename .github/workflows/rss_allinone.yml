name: RSSHub private snapshots

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**', 'tests/**']
  schedule:
    - cron: '0 0,6,12,18 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      deploy_gateway:
        description: Deploy the private gateway source and inject READONLY / WRITEONLY
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghactions-rss-${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh]') && 'validation' || 'production' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  LANG: C.UTF-8
  GIT_TERMINAL_PROMPT: '0'
  DATA_REPOSITORY: Grinch27/cloudflare-pages-ghactions-rss
  PAGES_PROJECT: cloudflare-pages-ghactions-rss
  PAGES_BASE_URL: https://cloudflare-pages-ghactions-rss.pages.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check generic generator
        run: python3 -m unittest discover -s tests -v

  runner-image:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.runner.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner image
        id: runner
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  refresh:
    needs: [validate, runner-image]
    runs-on: ${{ needs.runner-image.outputs.image }}
    timeout-minutes: 90
    steps:
      - name: Checkout execution code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check required credentials
        env:
          READONLY: ${{ secrets.READONLY }}
          WRITEONLY: ${{ secrets.WRITEONLY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$READONLY" || -z "$WRITEONLY" || -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo 'Required repository secret is missing.' >&2
            exit 1
          fi
      - name: Checkout private main
        uses: actions/checkout@v6
        with:
          repository: ${{ env.DATA_REPOSITORY }}
          ref: main
          token: ${{ secrets.READONLY }}
          path: private
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Validate private registry and gateway
        run: |
          python3 scripts/rss_site.py validate --data-directory private
          node --test private/worker/tests/*.test.mjs
      - name: Deploy gateway when requested
        id: gateway
        if: inputs.deploy_gateway || contains(github.event.head_commit.message, '[gateway]')
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: private/worker
          command: deploy
          quiet: 'true'
          secrets: |
            READONLY
            WRITEONLY
        env:
          READONLY: ${{ secrets.READONLY }}
          WRITEONLY: ${{ secrets.WRITEONLY }}
      - name: Initialize distribution during migration
        if: contains(github.event.head_commit.message, '[bootstrap]')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: private
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=false
          quiet: 'true'
      - name: Start official full RSSHub engine
        env:
          RSSHUB_ENV: ${{ secrets.RSSHUB_ENV }}
        run: |
          set -euo pipefail
          image="$(python3 scripts/rss_site.py image --data-directory private)"
          docker pull "$image" >/dev/null
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'RSSHUB_IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"
          runtime_env="$RUNNER_TEMP/rsshub-runtime.env"
          printf '%s\n' "$RSSHUB_ENV" > "$runtime_env"
          chmod 600 "$runtime_env"
          docker run --detach --name ghactions-rss-runtime \
            --publish 127.0.0.1:1200:1200 --shm-size=1g \
            --env-file "$runtime_env" --env NODE_ENV=production \
            --env LOGGER_LEVEL=error "$image_ref" >/dev/null
          rm -f "$runtime_env"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:1200/healthz >/dev/null 2>&1; then
              echo 'RSSHub is ready.'
              exit 0
            fi
            sleep 1
          done
          echo 'RSSHub readiness failed.' >&2
          exit 1
      - name: Refresh registered subscriptions
        id: generate
        continue-on-error: true
        run: python3 scripts/rss_site.py generate --data-directory private
      - name: Save snapshot and private report
        id: persist
        if: always() && steps.generate.outcome != 'skipped'
        env:
          WRITEONLY: ${{ secrets.WRITEONLY }}
        run: |
          if [[ -f private/state/latest-cycle.json ]]; then
            python3 scripts/rss_site.py persist --data-directory private
          else
            exit 1
          fi
      - name: Publish saved private snapshot
        id: publish
        if: steps.generate.outputs.publishable == 'true' && steps.persist.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: private
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=false
          quiet: 'true'
      - name: Verify public snapshot
        id: verify
        if: steps.publish.outcome == 'success'
        env:
          CF_DEPLOYMENT_ID: ${{ steps.publish.outputs.pages-deployment-id }}
          CF_DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: python3 scripts/rss_site.py verify --data-directory private --base-url "$PAGES_BASE_URL"
      - name: Save private deployment result
        if: always() && steps.verify.outcome == 'success'
        env:
          WRITEONLY: ${{ secrets.WRITEONLY }}
        run: python3 scripts/rss_site.py persist --data-directory private
      - name: Stop RSSHub
        if: always()
        run: docker rm -f ghactions-rss-runtime >/dev/null 2>&1 || true
      - name: Report blocked cycle
        if: always() && (steps.generate.outcome == 'failure' || steps.gateway.outcome == 'failure')
        run: |
          echo 'A requested operation failed. Detailed feed state is in the private repository.' >&2
          exit 1
