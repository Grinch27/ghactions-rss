# Requirements: public Actions executes; publish only changed public snapshots.
# Manual setup: READONLY/WRITEONLY must include Grinch27/cloudflare-RSSHUB_reader.
# Follow-up: connect the private repository to Workers Builds before the first refresh.
# Optimization: no-op cycles write state/ only; no upload or Reader deploy hook.
# Risks: never print routes, runtime secrets, response bodies, or token values.
# Unknowns: credential permissions are checked by real checkout/persistence, never by secret names.
# Validation: unique cycle/report gates, state-only failures and one explicit Workers build retry.
name: RSSHub private snapshots

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rss_allinone.yml']
  schedule:
    - cron: '0 0,6,12,18 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      verify_existing:
        description: Verify the existing snapshot after retrying its failed Workers build once
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghactions-rss-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  LANG: C.UTF-8
  GIT_TERMINAL_PROMPT: '0'
  DATA_REPOSITORY: Grinch27/cloudflare-RSSHUB_reader
  PUBLICATION_BASE_URL: https://1616255.xyz/reader

jobs:
  runner-image:
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.runner.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner image
        id: runner
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  refresh:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 90
    steps:
      - name: Check migration credentials
        env:
          READONLY: ${{ secrets.READONLY }}
          WRITEONLY: ${{ secrets.WRITEONLY }}
        run: |
          test -n "$READONLY"
          test -n "$WRITEONLY"
      - name: Checkout private main
        uses: actions/checkout@main
        with:
          repository: ${{ env.DATA_REPOSITORY }}
          ref: main
          token: ${{ secrets.READONLY }}
          path: private
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Validate migrated source and reader
        working-directory: private
        run: |
          npm test
          npm run validate:rss
      - name: Start official RSSHub engine
        if: inputs.verify_existing != true
        env:
          RSSHUB_ENV: ${{ secrets.RSSHUB_ENV }}
        run: |
          set -euo pipefail
          image="$(python3 private/scripts/rss_site.py image --data-directory private)"
          docker pull "$image" >/dev/null
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'RSSHUB_IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"
          runtime_env="$RUNNER_TEMP/rsshub-runtime.env"
          printf '%s\n' "$RSSHUB_ENV" > "$runtime_env"
          chmod 600 "$runtime_env"
          docker run --detach --name ghactions-rss-runtime \
            --publish 127.0.0.1:1200:1200 --shm-size=1g \
            --env-file "$runtime_env" --env NODE_ENV=production \
            --env LOGGER_LEVEL=error "$image_ref" >/dev/null
          rm -f "$runtime_env"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:1200/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Prepare refresh cycle
        id: cycle
        run: python3 -c 'import uuid; print("cycle_id=" + uuid.uuid4().hex)' >> "$GITHUB_OUTPUT"
      - name: Refresh registered subscriptions
        id: generate
        if: inputs.verify_existing != true
        continue-on-error: true
        env:
          RSS_CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: python3 private/scripts/rss_site.py generate --data-directory private
      - name: Save RSS snapshot and private report
        id: persist
        if: >-
          always() && steps.generate.outputs.report_saved == 'true' &&
          steps.generate.outputs.cycle_id == steps.cycle.outputs.cycle_id
        env:
          WRITEONLY: ${{ secrets.WRITEONLY }}
          RSS_CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [[ "$GENERATION_OUTCOME" == success ]]; then
            python3 private/scripts/rss_site.py persist --data-directory private
          else
            python3 private/scripts/rss_site.py persist --data-directory private --state-only
          fi
      - name: Verify new or existing Static Assets publication
        id: verify
        if: >-
          steps.generate.outcome == 'success' && steps.generate.outputs.generation_completed == 'true' &&
          steps.generate.outputs.cycle_id == steps.cycle.outputs.cycle_id &&
          steps.generate.outputs.publishable == 'true' && steps.persist.outcome == 'success'
        env:
          PUBLICATION_WAIT_SECONDS: ${{ steps.generate.outputs.publication_changed == 'true' && '900' || '0' }}
          RSS_CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: python3 private/scripts/rss_site.py verify --data-directory private --base-url "$PUBLICATION_BASE_URL" --wait-seconds "$PUBLICATION_WAIT_SECONDS"
      - name: Verify existing publication after Workers recovery
        id: recovery
        if: inputs.verify_existing == true
        env:
          RSS_CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: python3 private/scripts/rss_site.py verify --data-directory private --base-url "$PUBLICATION_BASE_URL" --wait-seconds 0 --record-cycle
      - name: Verify unified Reader and RSS runtime
        if: steps.verify.outcome == 'success' || steps.recovery.outcome == 'success'
        env:
          RSS_CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: python3 private/scripts/verify_runtime.py --data-directory private
      - name: Save private publication result
        if: >-
          always() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure' ||
          steps.recovery.outcome == 'success' || steps.recovery.outcome == 'failure')
        env:
          WRITEONLY: ${{ secrets.WRITEONLY }}
          RSS_CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: python3 private/scripts/rss_site.py persist --data-directory private --state-only
      - name: Stop RSSHub
        if: always()
        run: docker rm -f ghactions-rss-runtime >/dev/null 2>&1 || true
      - name: Report blocked cycle
        if: always() && steps.generate.outcome == 'failure'
        run: exit 1
